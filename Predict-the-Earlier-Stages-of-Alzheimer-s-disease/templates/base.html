<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NeuroCare AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: #e5e7eb;
      font-family: "Segoe UI", sans-serif;
    }

    /* NAVBAR */
    .topbar {
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: bold;
      color: #38bdf8;
      font-size: 18px;
    }

    .tag {
      font-size: 12px;
      color: #94a3b8;
    }

    /* MAIN CONTAINER */
    .container-box {
      max-width: 1100px;
      margin: 30px auto;
      padding: 10px;
    }

    /* CARD STYLE */
    .card-dark {
      background: rgba(255,255,255,0.05);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }

    /* BUTTONS */
    .btn-primary {
      background: #2563eb;
      border: none;
    }

    .btn-success {
      background: #16a34a;
      border: none;
    }

    .btn-danger {
      background: #dc2626;
      border: none;
    }

    .btn {
      border-radius: 10px;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #1f2937;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">🧠 NeuroCare AI</div>
    <div class="tag">Clinical Decision Support System</div>
  </div>

  <!-- PAGE CONTENT -->
  <div class="container-box">
    {% block content %}{% endblock %}
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 NeuroCare AI | Research Prototype System | Developed by Jeevana Kalla
  </div>

</body>
</html>
