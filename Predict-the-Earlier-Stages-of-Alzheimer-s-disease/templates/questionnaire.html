<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cognitive Questionnaire</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: Arial;
    }

    .card {
      background: white;
      color: black;
      border-radius: 15px;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container mt-5">

  <h2 class="text-center mb-4">🧠 Cognitive Health Questionnaire</h2>

  <div class="card">

    <form action="/predict_questionnaire" method="post">

      <label>Do you forget recent conversations?</label>
      <select name="q1" class="form-control">
        <option value="0">Never</option>
        <option value="1">Sometimes</option>
        <option value="2">Often</option>
      </select>

      <label class="mt-3">Do you misplace objects?</label>
      <select name="q2" class="form-control">
        <option value="0">Never</option>
        <option value="1">Sometimes</option>
        <option value="2">Often</option>
      </select>

      <label class="mt-3">Do you get confused about time/place?</label>
      <select name="q3" class="form-control">
        <option value="0">Never</option>
        <option value="1">Sometimes</option>
        <option value="2">Often</option>
      </select>

      <label class="mt-3">Do you struggle finding words?</label>
      <select name="q4" class="form-control">
        <option value="0">Never</option>
        <option value="1">Sometimes</option>
        <option value="2">Often</option>
      </select>

      <label class="mt-3">Difficulty managing daily tasks?</label>
      <select name="q5" class="form-control">
        <option value="0">Never</option>
        <option value="1">Sometimes</option>
        <option value="2">Often</option>
      </select>

      <button class="btn btn-primary mt-4 w-100">
        Analyze Cognitive Risk
      </button>

    </form>

  </div>

</div>

</body>
</html>
